[package]
name = "golem-ai-search-meilisearch"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://golem.cloud"
repository = "https://github.com/golemcloud/golem-ai"
description = "Library for working with MeiliSearch APIs on Golem Cloud"

[lib]
path = "src/lib.rs"

[features]
default = ["golem"]
golem = ["dep:golem-rust", "golem-ai-search/golem"]

[dependencies]
golem-ai-search = { workspace = true }
golem-ai-http = { workspace = true }

base64 = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
golem-rust = { workspace = true, optional = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasip3 = { workspace = true }
