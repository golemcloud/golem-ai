[workspace]
resolver = "2"
members = ["components-rust/*", "common-rust/*"]

[profile.release]
opt-level = "s"
lto = true

[workspace.dependencies]

golem-rust = { path = "../../../golem/sdks/rust/golem-rust", features = [
    "export_golem_agentic",
#    "golem_ai" # Uncomment to use Golem AI libraries
] }

log = { version = "0.4.29", features = ["kv"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
