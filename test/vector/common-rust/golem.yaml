# Schema for IDEA:
# $schema: https://schema.golem.cloud/app/golem/1.6.0-dev.7/golem.schema.json
# Schema for vscode-yaml:
# yaml-language-server: $schema=https://schema.golem.cloud/app/golem/1.6.0-dev.7/golem.schema.json

# Field reference: https://learn.golem.cloud/app-manifest#field-reference
# Creating HTTP APIs: https://learn.golem.cloud/invoke/making-custom-apis

manifestVersion: 1.6.0
componentTemplates:
  rust-custom:
    presets:
      # DEBUG PROFILES
      milvus-debug:
        default: true
        build:
        - command: cargo build --target wasm32-wasip2 --no-default-features --features milvus
          sources:
          - src
          - ../../common-rust
          - Cargo.toml
          - ../../Cargo.toml
          targets:
          - "{{ cargoTarget }}/wasm32-wasip2/debug/{{ component_name | to_snake_case }}.wasm"
        componentWasm: "{{ cargoTarget }}/wasm32-wasip2/debug/{{ component_name | to_snake_case }}.wasm"
        outputWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}_milvus_debug.wasm"
        clean:
        - src/bindings.rs

      pinecone-debug:
        build:
        - command: cargo build --target wasm32-wasip2 --no-default-features --features pinecone
          sources:
          - src
          - ../../common-rust
          - Cargo.toml
          - ../../Cargo.toml
          targets:
          - "{{ cargoTarget }}/wasm32-wasip2/debug/{{ component_name | to_snake_case }}.wasm"
        componentWasm: "{{ cargoTarget }}/wasm32-wasip2/debug/{{ component_name | to_snake_case }}.wasm"
        outputWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}_pinecone_debug.wasm"
        clean:
        - src/bindings.rs

      qdrant-debug:
        build:
        - command: cargo build --target wasm32-wasip2 --no-default-features --features qdrant
          sources:
          - src
          - ../../common-rust
          - Cargo.toml
          - ../../Cargo.toml
          targets:
          - "{{ cargoTarget }}/wasm32-wasip2/debug/{{ component_name | to_snake_case }}.wasm"
        componentWasm: "{{ cargoTarget }}/wasm32-wasip2/debug/{{ component_name | to_snake_case }}.wasm"
        outputWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}_qdrant_debug.wasm"
        clean:
        - src/bindings.rs

      pgvector-debug:
        build:
        - command: cargo build --target wasm32-wasip2 --no-default-features --features pgvector
          sources:
          - src
          - ../../common-rust
          - Cargo.toml
          - ../../Cargo.toml
          targets:
          - "{{ cargoTarget }}/wasm32-wasip2/debug/{{ component_name | to_snake_case }}.wasm"
        componentWasm: "{{ cargoTarget }}/wasm32-wasip2/debug/{{ component_name | to_snake_case }}.wasm"
        outputWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}_pgvector_debug.wasm"
        clean:
        - src/bindings.rs

      # RELEASE PROFILES
      milvus-release:
        build:
        - command: cargo build --target wasm32-wasip2 --release --no-default-features --features milvus
          sources:
          - src
          - ../../common-rust
          - Cargo.toml
          - ../../Cargo.toml
          targets:
          - "{{ cargoTarget }}/wasm32-wasip2/release/{{ component_name | to_snake_case }}.wasm"
        componentWasm: "{{ cargoTarget }}/wasm32-wasip2/release/{{ component_name | to_snake_case }}.wasm"
        outputWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}_milvus_release.wasm"
        clean:
        - src/bindings.rs

      pinecone-release:
        build:
        - command: cargo build --target wasm32-wasip2 --release --no-default-features --features pinecone
          sources:
          - src
          - ../../common-rust
          - Cargo.toml
          - ../../Cargo.toml
          targets:
          - "{{ cargoTarget }}/wasm32-wasip2/release/{{ component_name | to_snake_case }}.wasm"
        componentWasm: "{{ cargoTarget }}/wasm32-wasip2/release/{{ component_name | to_snake_case }}.wasm"
        outputWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}_pinecone_release.wasm"
        clean:
        - src/bindings.rs

      qdrant-release:
        build:
        - command: cargo build --target wasm32-wasip2 --release --no-default-features --features qdrant
          sources:
          - src
          - ../../common-rust
          - Cargo.toml
          - ../../Cargo.toml
          targets:
          - "{{ cargoTarget }}/wasm32-wasip2/release/{{ component_name | to_snake_case }}.wasm"
        componentWasm: "{{ cargoTarget }}/wasm32-wasip2/release/{{ component_name | to_snake_case }}.wasm"
        outputWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}_qdrant_release.wasm"
        clean:
        - src/bindings.rs

      pgvector-release:
        build:
        - command: cargo build --target wasm32-wasip2 --release --no-default-features --features pgvector
          sources:
          - src
          - ../../common-rust
          - Cargo.toml
          - ../../Cargo.toml
          targets:
          - "{{ cargoTarget }}/wasm32-wasip2/release/{{ component_name | to_snake_case }}.wasm"
        componentWasm: "{{ cargoTarget }}/wasm32-wasip2/release/{{ component_name | to_snake_case }}.wasm"
        outputWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}_pgvector_release.wasm"
        clean:
        - src/bindings.rs
customCommands:
  cargo-clean:
  - command: cargo clean
