# Schema for IDEA:
# $schema: https://schema.golem.cloud/app/golem/1.6.0-dev.8/golem.schema.json
# Schema for vscode-yaml:
# yaml-language-server: $schema=https://schema.golem.cloud/app/golem/1.6.0-dev.8/golem.schema.json

# Field reference: https://learn.golem.cloud/app-manifest#field-reference
# Creating HTTP APIs: https://learn.golem.cloud/invoke/making-custom-apis

manifestVersion: 1.6.0
componentTemplates:
  rust-custom:
    presets:
      # DEBUG PROFILES
      neo4j-debug:
        default: true
        build:
        - command: cargo build --target wasm32-wasip2 --no-default-features --features neo4j
          sources:
          - src
          - ../../common-rust
          - Cargo.toml
          - ../../Cargo.toml
          targets:
          - "{{ cargoTarget }}/wasm32-wasip2/debug/{{ component_name | to_snake_case }}.wasm"
        componentWasm: "{{ cargoTarget }}/wasm32-wasip2/debug/{{ component_name | to_snake_case }}.wasm"
        outputWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}_neo4j_debug.wasm"
        clean:
        - src/bindings.rs

      arangodb-debug:
        build:
        - command: cargo build --target wasm32-wasip2 --no-default-features --features arangodb
          sources:
          - src
          - ../../common-rust
          - Cargo.toml
          - ../../Cargo.toml
          targets:
          - "{{ cargoTarget }}/wasm32-wasip2/debug/{{ component_name | to_snake_case }}.wasm"
        componentWasm: "{{ cargoTarget }}/wasm32-wasip2/debug/{{ component_name | to_snake_case }}.wasm"
        outputWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}_arangodb_debug.wasm"
        clean:
        - src/bindings.rs

      janusgraph-debug:
        build:
        - command: cargo build --target wasm32-wasip2 --no-default-features --features janusgraph
          sources:
          - src
          - ../../common-rust
          - Cargo.toml
          - ../../Cargo.toml
          targets:
          - "{{ cargoTarget }}/wasm32-wasip2/debug/{{ component_name | to_snake_case }}.wasm"
        componentWasm: "{{ cargoTarget }}/wasm32-wasip2/debug/{{ component_name | to_snake_case }}.wasm"
        outputWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}_janusgraph_debug.wasm"
        clean:
        - src/bindings.rs

      # RELEASE PROFILES
      neo4j-release:
        build:
        - command: cargo build --target wasm32-wasip2 --release --no-default-features --features neo4j
          sources:
          - src
          - ../../common-rust
          - Cargo.toml
          - ../../Cargo.toml
          targets:
          - "{{ cargoTarget }}/wasm32-wasip2/release/{{ component_name | to_snake_case }}.wasm"
        componentWasm: "{{ cargoTarget }}/wasm32-wasip2/release/{{ component_name | to_snake_case }}.wasm"
        outputWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}_neo4j_release.wasm"
        clean:
        - src/bindings.rs

      arangodb-release:
        build:
        - command: cargo build --target wasm32-wasip2 --release --no-default-features --features arangodb
          sources:
          - src
          - ../../common-rust
          - Cargo.toml
          - ../../Cargo.toml
          targets:
          - "{{ cargoTarget }}/wasm32-wasip2/release/{{ component_name | to_snake_case }}.wasm"
        componentWasm: "{{ cargoTarget }}/wasm32-wasip2/release/{{ component_name | to_snake_case }}.wasm"
        outputWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}_arangodb_release.wasm"
        clean:
        - src/bindings.rs

      janusgraph-release:
        build:
        - command: cargo build --target wasm32-wasip2 --release --no-default-features --features janusgraph
          sources:
          - src
          - ../../common-rust
          - Cargo.toml
          - ../../Cargo.toml
          targets:
          - "{{ cargoTarget }}/wasm32-wasip2/release/{{ component_name | to_snake_case }}.wasm"
        componentWasm: "{{ cargoTarget }}/wasm32-wasip2/release/{{ component_name | to_snake_case }}.wasm"
        outputWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}_janusgraph_release.wasm"
        clean:
        - src/bindings.rs
customCommands:
  cargo-clean:
  - command: cargo clean
