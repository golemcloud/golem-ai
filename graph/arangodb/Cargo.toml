[package]
name = "golem-ai-graph-arangodb"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://golem.cloud"
repository = "https://github.com/golemcloud/golem-ai"
description = "Library for working with ArangoDB APIs on Golem Cloud"

[lib]
path = "src/lib.rs"

[features]
default = ["golem"]
golem = ["dep:golem-rust", "golem-ai-graph/golem"]

[dependencies]
golem-ai-graph = { workspace = true }

async-trait = "0.1.89"
base64 = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
golem-ai-http = { workspace = true }
golem-rust = { workspace = true, optional = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
